# Praca domowa konfiguraja do yamla

spring:
  jackson:
    mapper:
      default-view-inclusion: true
  datasource:
#    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  profiles:
    active: prod

logging:
  level:
    root: WARN


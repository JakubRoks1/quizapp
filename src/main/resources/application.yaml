# Praca domowa konfiguraja do yamla

spring:
  datasource:
    url: jdbc:h2:file:./mydb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
  h2:
    console:
      enabled: true

server:
  error:
    include-binding-errors: always
    include-exception: true
    include-message: always

custom:
  flag: false
  number: 12

logging:
  level:
    root: INFO

#debug: true
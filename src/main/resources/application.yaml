# Praca domowa konfiguraja do yamla

spring:
  datasource:
    url: jdbc:h2:file:./mydb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
  h2:
    console:
      enabled: true

server:
  error:
    include-binding-errors: always
    include-exception: true
    include-message: always
    include-stacktrace: always

logging:
  level:
    root: INFO

#debug: true

custom:
  flag: false
  number: 12

person:
  firST-name: Mateusz
  lastName: Kowalski
  AGE: 35
  middle-name: Andrzej
  is-married: true
  birth-date: 2007-12-01
  duration: 60
